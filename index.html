<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Yollo RP — استكشاف الشخصيات</title>
  <style>
    :root {
      --bg-main: #080b11;
      --bg-header: rgba(15, 20, 31, 0.9);
      --bg-sidebar: #0e131f;
      --bg-card: #121824;
      --bg-bot: rgba(24, 32, 48, 0.92);
      --bg-user: linear-gradient(135deg, #2563eb, #3b82f6);
      --bg-input: #141b29;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f3f4f6;
      --text-action: #9ca3af;
      --text-quote: #ffffff;
      --accent: #6366f1;
      --accent-blue: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --chat-font-size: 14.5px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100dvh;
      overflow: hidden;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      position: relative;
    }

    .view.active {
      display: flex;
    }

    /* ==================== القائمة الجانبية (Sidebar Drawer) ==================== */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 40;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 285px;
      max-width: 82vw;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border-strong);
      transform: translateX(105%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 45;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-drawer.open {
      transform: translateX(0);
    }

    .drawer-top {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.14), transparent);
    }

    .drawer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .drawer-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }

    .drawer-brand-text h2 {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }

    .drawer-brand-text span {
      font-size: 11px;
      color: var(--text-action);
    }

    .close-drawer-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-action);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    .drawer-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-action);
      padding: 0 6px;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .drawer-nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .drawer-item {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      text-align: right;
    }

    .drawer-item:hover,
    .drawer-item:active {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-color);
    }

    .drawer-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .drawer-badge {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* المحادثات النشطة داخل القائمة الجانبية */
    .recent-chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      cursor: pointer;
      margin-bottom: 6px;
    }

    .recent-chat-item img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      flex-shrink: 0;
    }

    .recent-chat-meta {
      min-width: 0;
      flex: 1;
    }

    .recent-chat-meta h4 {
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-chat-meta p {
      font-size: 11px;
      color: var(--text-action);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* خيارات التخصيص في القائمة */
    .pref-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pref-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: #cbd5e1;
    }

    .font-size-group {
      display: flex;
      gap: 4px;
    }

    .size-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-action);
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 11px;
      cursor: pointer;
    }

    .size-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .toggle-pill {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
    }

    .toggle-pill.on {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .drawer-footer {
      padding: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .drawer-footer button {
      flex: 1;
      padding: 8px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: #cbd5e1;
    }

    .drawer-footer button.danger-btn {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    /* ==================== 1. الواجهة الرئيسية (Lobby) ==================== */
    .home-header {
      background-color: var(--bg-header);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }

    .header-right-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .menu-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      font-size: 17px;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      padding: 2px 7px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
    }

    .search-box {
      flex: 1;
      max-width: 200px;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 8px 13px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .filter-section {
      padding: 12px 14px 6px;
      background-color: var(--bg-main);
    }

    .pill-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .pill-tabs::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-action);
      padding: 6px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-pill.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .bots-grid-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 28px;
    }

    .bots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .bots-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 960px) {
      .bots-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .bot-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .bot-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }

    .delete-custom-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 4;
      background: rgba(15, 20, 31, 0.78);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 3.65;
      background-color: #1c2436;
      overflow: hidden;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .card-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(18, 24, 36, 0.98) 0%, transparent 45%);
      pointer-events: none;
    }

    .chat-count-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 2;
      background: rgba(8, 11, 17, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 4px;
      direction: ltr;
    }

    .card-body {
      padding: 10px 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      direction: ltr;
      text-align: left;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-action);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: auto;
      padding-top: 4px;
      direction: rtl;
    }

    .tag-chip {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 10.5px;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .add-bot-card {
      background: rgba(18, 24, 36, 0.5);
      border: 1.5px dashed rgba(99, 102, 241, 0.35);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 14px;
      color: var(--text-action);
      min-height: 250px;
      gap: 10px;
      cursor: pointer;
    }

    .add-icon-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .add-bot-card p {
      font-size: 13px;
      font-weight: 600;
    }

    .add-bot-card small {
      font-size: 11px;
      color: var(--text-action);
    }

    /* ==================== 2. واجهة المحادثة (Chat View) ==================== */
    .ambient-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: top center;
      filter: blur(42px) saturate(1.2);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
      transform: scale(1.1);
    }

    header.chat-header {
      background-color: var(--bg-header);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }

    .chat-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .back-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bot-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background-color: #1f2937;
    }

    .bot-info h1 {
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-action);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
    }

    .status-dot.typing {
      background-color: #f59e0b;
      animation: pulse 1s infinite;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .icon-btn.danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    #chatContainer {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      position: relative;
      z-index: 1;
    }

    .character-intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 14px 12px 18px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .intro-avatar {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
      background-color: #1f2937;
    }

    .intro-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .intro-bio {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-action);
      max-width: 92%;
      direction: ltr;
    }

    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      max-width: 92%;
      animation: fadeIn 0.2s ease-out;
    }

    .msg-row.user {
      align-self: flex-start;
      flex-direction: row;
    }

    .msg-row.bot,
    .msg-row.error {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      flex-shrink: 0;
      margin-top: 2px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background-color: #1f2937;
    }

    .msg-content-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.72;
      font-size: var(--chat-font-size);
      white-space: pre-wrap;
      word-wrap: break-word;
      backdrop-filter: blur(8px);
    }

    .msg-row.user .bubble {
      background: var(--bg-user);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    .msg-row.bot .bubble {
      background-color: var(--bg-bot);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .msg-row.bot .bubble.ltr-msg {
      direction: ltr;
      text-align: left;
    }

    .msg-row.bot .bubble.image-bubble {
      padding: 6px;
      background-color: var(--bg-bot);
      border: 1px solid var(--border-color);
    }

    .chat-sent-img {
      display: block;
      width: 210px;
      max-width: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    .msg-row.error .bubble {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .msg-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
      opacity: 0.78;
    }

    .msg-row.user .msg-tools {
      justify-content: flex-start;
    }

    .msg-row.bot .msg-tools {
      justify-content: flex-end;
    }

    .mini-tool-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-action);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .rp-action {
      color: var(--text-action);
      font-style: italic;
    }

    .rp-quote {
      color: var(--text-quote);
      font-weight: 600;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background-color: var(--text-action);
      border-radius: 50%;
      animation: bounce 1.3s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    .quick-bar {
      display: flex;
      gap: 8px;
      padding: 8px 14px;
      overflow-x: auto;
      background-color: rgba(8, 11, 17, 0.85);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-color);
      scrollbar-width: none;
      position: relative;
      z-index: 2;
    }

    .quick-bar.hidden {
      display: none;
    }

    .quick-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip:active {
      background-color: var(--accent-blue);
      color: #fff;
    }

    .input-area {
      background-color: var(--bg-header);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color);
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      position: relative;
      z-index: 2;
    }

    textarea {
      flex: 1;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      padding: 11px 14px;
      font-size: 14.5px;
      resize: none;
      max-height: 110px;
      min-height: 44px;
      outline: none;
      line-height: 1.4;
    }

    textarea:focus {
      border-color: var(--accent-blue);
    }

    #sendBtn {
      background: var(--bg-user);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      height: 44px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* نافذة إضافة شخصية جديدة */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #121824;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal h2 {
      font-size: 16px;
      color: #fff;
    }

    .modal label {
      font-size: 12px;
      color: var(--text-action);
      display: block;
      margin-bottom: 4px;
    }

    .modal input,
    .modal textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 13px;
      min-height: 38px;
    }

    .modal-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ==================== القائمة الجانبية ==================== -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="sidebar-drawer" id="sidebarDrawer">
    <div class="drawer-top">
      <div class="drawer-brand">
        <div class="drawer-logo">Y</div>
        <div class="drawer-brand-text">
          <h2>Yollo RP</h2>
          <span id="drawerStatsText">1 شخصية متاحة</span>
        </div>
      </div>
      <button class="close-drawer-btn" id="closeDrawerBtn">✕</button>
    </div>

    <div class="drawer-scroll">
      <div>
        <div class="drawer-section-title">التنقل السريع</div>
        <div class="drawer-nav-list">
          <button class="drawer-item" id="navHomeBtn">
            <span class="drawer-item-left">🏠 الرئيسية واستكشاف البوتات</span>
          </button>
          <button class="drawer-item" id="navCustomBtn">
            <span class="drawer-item-left">⭐ الشخصيات المخصصة</span>
            <span class="drawer-badge" id="customCountBadge">0</span>
          </button>
          <button class="drawer-item" id="navAddBotBtn">
            <span class="drawer-item-left">➕ إضافة شخصية جديدة</span>
          </button>
        </div>
      </div>

      <div>
        <div class="drawer-section-title">سجل المحادثات النشطة</div>
        <div id="drawerRecentList"></div>
      </div>

      <div>
        <div class="drawer-section-title">تخصيص الواجهة</div>
        <div class="pref-box">
          <div class="pref-row">
            <span>حجم خط الرسائل</span>
            <div class="font-size-group">
              <button class="size-btn" data-size="13px">صغير</button>
              <button class="size-btn active" data-size="14.5px">متوسط</button>
              <button class="size-btn" data-size="16.5px">كبير</button>
            </div>
          </div>
          <div class="pref-row">
            <span>شريط الردود السريعة</span>
            <button class="toggle-pill on" id="toggleQuickRepliesBtn">مفعّل</button>
          </div>
          <div class="pref-row">
            <span>أصوات النقرات</span>
            <button class="toggle-pill on" id="drawerSfxBtn">مفعّل</button>
          </div>
        </div>
      </div>
    </div>

    <div class="drawer-footer">
      <button id="exportDataBtn">نسخ احتياطي</button>
      <button class="danger-btn" id="resetAllDataBtn">تصفير الكل</button>
    </div>
  </aside>

  <!-- ==================== 1. الواجهة الرئيسية ==================== -->
  <section id="homeView" class="view active">
    <header class="home-header">
      <div class="header-right-group">
        <button class="menu-btn" id="openDrawerHomeBtn" title="القائمة">☰</button>
        <div class="brand">
          <span>Yollo RP</span>
          <span class="brand-badge">FREE</span>
        </div>
      </div>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="ابحث عن شخصية..." />
      </div>
    </header>

    <div class="filter-section">
      <div class="pill-tabs" id="categoryTabs">
        <button class="filter-pill active" data-filter="all">الكل ✨</button>
        <button class="filter-pill" data-filter="female">أنثى ♀</button>
        <button class="filter-pill" data-filter="anime">أنيمي</button>
        <button class="filter-pill" data-filter="story">قصة</button>
        <button class="filter-pill" data-filter="custom">مخصصة ⭐</button>
      </div>
    </div>

    <div class="bots-grid-wrapper">
      <div class="bots-grid" id="botsGrid"></div>
    </div>
  </section>

  <!-- ==================== 2. واجهة المحادثة ==================== -->
  <section id="chatView" class="view">
    <div class="ambient-bg" id="ambientBg"></div>

    <header class="chat-header">
      <div class="chat-header-right">
        <button class="back-btn" id="openDrawerChatBtn" title="القائمة">☰</button>
        <button class="back-btn" id="backBtn" title="العودة للرئيسية">→</button>
        <div class="bot-profile">
          <img class="header-avatar" id="chatHeaderAvatar" src="" alt="" />
          <div class="bot-info">
            <h1 id="chatHeaderName">Cow Girl Emma</h1>
            <div class="status-line">
              <span class="status-dot" id="statusDot"></span>
              <span id="statusText">متصل • جاهز</span>
            </div>
          </div>
        </div>
      </div>
      <div class="header-controls">
        <button class="icon-btn danger" id="clearBtn">مسح</button>
      </div>
    </header>

    <main id="chatContainer"></main>

    <div class="quick-bar" id="quickBar"></div>

    <div class="input-area">
      <textarea id="msgInput" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
      <button id="sendBtn">إرسال</button>
    </div>
  </section>

  <!-- نافذة إضافة شخصية جديدة -->
  <div class="modal-backdrop" id="addBotModal">
    <div class="modal">
      <h2>إضافة شخصية جديدة</h2>
      <div>
        <label>اسم الشخصية</label>
        <input type="text" id="newBotName" placeholder="مثال: Oujodere Classmate" />
      </div>
      <div class="modal-row">
        <div>
          <label>Bot ID</label>
          <input type="number" id="newBotId" placeholder="148005" dir="ltr" />
        </div>
        <div>
          <label>Session ID</label>
          <input type="number" id="newSessionId" placeholder="21702378" dir="ltr" />
        </div>
      </div>
      <div>
        <label>رابط صورة الشخصية</label>
        <input type="url" id="newBotAvatar" placeholder="https://..." dir="ltr" />
      </div>
      <div>
        <label>وصف مختصر (Bio)</label>
        <input type="text" id="newBotBio" placeholder="وصف الشخصية الذي يظهر تحت الاسم..." />
      </div>
      <div>
        <label>الرسالة الافتتاحية (Greeting)</label>
        <textarea id="newBotGreeting" rows="2" placeholder="*تبتسم وتنظر إليك* مرحباً..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="icon-btn" id="cancelAddBotBtn">إلغاء</button>
        <button class="icon-btn" style="background: var(--accent); border-color: var(--accent);" id="saveNewBotBtn">إضافة</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://hin-18-1.onrender.com";
    const STORAGE_KEY_CUSTOM_BOTS = "yollo_custom_bots_list_v1";
    const STORAGE_KEY_SFX = "yollo_ui_sfx_enabled";
    const STORAGE_KEY_FONT = "yollo_ui_font_size";
    const STORAGE_KEY_QUICK = "yollo_ui_quick_replies";

    const DEFAULT_BOTS = [
      {
        botId: 148005,
        sessionId: 21702378,
        name: "Cow Girl Emma",
        avatarUrl: "https://d.top4top.io/p_39776f6w21.jpg",
        chatsCount: "4.0m",
        isCustom: false,
        categories: ["all", "female", "anime", "story"],
        tags: ["cowgirl", "رعب", "قصة"],
        bio: 'Emma is a little dense cow girl. She does have a very positive energy. Emma loves to bake, insisting on you trying her food. Food she baked with her “secret ingredient”.',
        greeting: "*You recently inherited a farm from your grandparents. You have always struggled with money so you think life on a farm could work to make an extra buck. When you make it to the farm for the first time. It’s completely dilapidated with no crops or livestock to be seen. When you enter the house off to the side, you find a woman with cow horns and a tail, wearing a cow print bikini and a bell collar sleeping on the floor. She wakes up when you enter.*\n“Hello, master.”",
        sendWelcomeImage: true,
        initialQuickReplies: [
          { label: "مرحبا", text: "مرحبا" },
          { label: "*ينظر حوله بدهشة*", text: "*ينظر حوله في المنزل المتهالك بدهشة* من أنتِ؟ وكيف دخلتِ إلى هنا؟" },
          { label: "أخبريني عن المزرعة", text: "مرحباً إيما، أنا صاحب المزرعة الجديد. أخبريني ما الذي حدث لهذا المكان؟" },
          { label: "ما سر الكعك؟", text: "سمعت أنكِ تحبين الخبز، ما الذي تطبخينه هنا؟" }
        ]
      }
    ];

    // عناصر القائمة الجانبية
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const sidebarDrawer = document.getElementById("sidebarDrawer");
    const openDrawerHomeBtn = document.getElementById("openDrawerHomeBtn");
    const openDrawerChatBtn = document.getElementById("openDrawerChatBtn");
    const closeDrawerBtn = document.getElementById("closeDrawerBtn");
    const drawerStatsText = document.getElementById("drawerStatsText");
    const customCountBadge = document.getElementById("customCountBadge");
    const drawerRecentList = document.getElementById("drawerRecentList");
    const navHomeBtn = document.getElementById("navHomeBtn");
    const navCustomBtn = document.getElementById("navCustomBtn");
    const navAddBotBtn = document.getElementById("navAddBotBtn");
    const toggleQuickRepliesBtn = document.getElementById("toggleQuickRepliesBtn");
    const drawerSfxBtn = document.getElementById("drawerSfxBtn");
    const exportDataBtn = document.getElementById("exportDataBtn");
    const resetAllDataBtn = document.getElementById("resetAllDataBtn");

    // عناصر الواجهة الرئيسية والمحادثة
    const homeView = document.getElementById("homeView");
    const chatView = document.getElementById("chatView");
    const ambientBg = document.getElementById("ambientBg");
    const botsGrid = document.getElementById("botsGrid");
    const searchInput = document.getElementById("searchInput");
    const categoryTabs = document.getElementById("categoryTabs");

    const backBtn = document.getElementById("backBtn");
    const chatHeaderAvatar = document.getElementById("chatHeaderAvatar");
    const chatHeaderName = document.getElementById("chatHeaderName");
    const chatContainer = document.getElementById("chatContainer");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const quickBar = document.getElementById("quickBar");
    const clearBtn = document.getElementById("clearBtn");

    const addBotModal = document.getElementById("addBotModal");
    const cancelAddBotBtn = document.getElementById("cancelAddBotBtn");
    const saveNewBotBtn = document.getElementById("saveNewBotBtn");

    let activeCategory = "all";
    let currentBot = null;
    let messages = [];
    let isSending = false;
    let sfxEnabled = localStorage.getItem(STORAGE_KEY_SFX) !== "false";
    let quickRepliesEnabled = localStorage.getItem(STORAGE_KEY_QUICK) !== "false";
    let savedFontSize = localStorage.getItem(STORAGE_KEY_FONT) || "14.5px";

    function applyPreferences() {
      document.documentElement.style.setProperty("--chat-font-size", savedFontSize);
      document.querySelectorAll(".size-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.size === savedFontSize);
      });

      quickBar.classList.toggle("hidden", !quickRepliesEnabled);
      toggleQuickRepliesBtn.textContent = quickRepliesEnabled ? "مفعّل" : "مخفي";
      toggleQuickRepliesBtn.classList.toggle("on", quickRepliesEnabled);

      drawerSfxBtn.textContent = sfxEnabled ? "مفعّل" : "مكتوم";
      drawerSfxBtn.classList.toggle("on", sfxEnabled);
    }

    document.querySelectorAll(".size-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        savedFontSize = btn.dataset.size;
        localStorage.setItem(STORAGE_KEY_FONT, savedFontSize);
        applyPreferences();
      });
    });

    toggleQuickRepliesBtn.addEventListener("click", () => {
      quickRepliesEnabled = !quickRepliesEnabled;
      localStorage.setItem(STORAGE_KEY_QUICK, String(quickRepliesEnabled));
      applyPreferences();
    });

    drawerSfxBtn.addEventListener("click", () => {
      sfxEnabled = !sfxEnabled;
      localStorage.setItem(STORAGE_KEY_SFX, String(sfxEnabled));
      applyPreferences();
    });

    function playUiPop(freq = 520) {
      if (!sfxEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.03, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch {}
    }

    function getAllBots() {
      let custom = [];
      try {
        custom = JSON.parse(localStorage.getItem(STORAGE_KEY_CUSTOM_BOTS) || "[]");
      } catch {}
      return [...DEFAULT_BOTS, ...custom];
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ==================== التحكم بالقائمة الجانبية ====================
    function openDrawer() {
      updateDrawerContent();
      drawerBackdrop.classList.add("open");
      sidebarDrawer.classList.add("open");
    }

    function closeDrawer() {
      drawerBackdrop.classList.remove("open");
      sidebarDrawer.classList.remove("open");
    }

    function updateDrawerContent() {
      const allBots = getAllBots();
      const customCount = allBots.filter(b => b.isCustom).length;
      drawerStatsText.textContent = `${allBots.length} شخصية متاحة`;
      customCountBadge.textContent = String(customCount);

      drawerRecentList.innerHTML = "";
      let activeChatsCount = 0;

      allBots.forEach(bot => {
        const botMsgs = loadBotMessages(bot);
        const hasUserMsg = botMsgs.some(m => m.role === "user");
        if (!hasUserMsg) return;

        activeChatsCount++;
        const lastTxt = [...botMsgs].reverse().find(m => m.content)?.content.replace(/\*/g, "") || "";
        const item = document.createElement("div");
        item.className = "recent-chat-item";
        item.innerHTML = `
          <img src="${bot.avatarUrl}" alt="${escapeHtml(bot.name)}" />
          <div class="recent-chat-meta">
            <h4>${escapeHtml(bot.name)}</h4>
            <p>${escapeHtml(lastTxt)}</p>
          </div>
        `;
        item.onclick = () => {
          closeDrawer();
          openBotChat(bot);
        };
        drawerRecentList.appendChild(item);
      });

      if (activeChatsCount === 0) {
        drawerRecentList.innerHTML = `<p style="font-size:12px; color:var(--text-action); padding:4px 6px;">لا توجد محادثات نشطة بعد.</p>`;
      }
    }

    openDrawerHomeBtn.addEventListener("click", openDrawer);
    openDrawerChatBtn.addEventListener("click", openDrawer);
    closeDrawerBtn.addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);

    navHomeBtn.addEventListener("click", () => {
      closeDrawer();
      chatView.classList.remove("active");
      homeView.classList.add("active");
      activeCategory = "all";
      categoryTabs.querySelectorAll(".filter-pill").forEach(b => {
        b.classList.toggle("active", b.dataset.filter === "all");
      });
      renderBotsGrid();
    });

    navCustomBtn.addEventListener("click", () => {
      closeDrawer();
      chatView.classList.remove("active");
      homeView.classList.add("active");
      activeCategory = "custom";
      categoryTabs.querySelectorAll(".filter-pill").forEach(b => {
        b.classList.toggle("active", b.dataset.filter === "custom");
      });
      renderBotsGrid();
    });

    navAddBotBtn.addEventListener("click", () => {
      closeDrawer();
      addBotModal.classList.add("open");
    });

    exportDataBtn.addEventListener("click", async () => {
      const backup = {
        customBots: getAllBots().filter(b => b.isCustom),
        chats: {}
      };
      getAllBots().forEach(b => {
        backup.chats[b.botId] = loadBotMessages(b);
      });
      try {
        await navigator.clipboard.writeText(JSON.stringify(backup, null, 2));
        alert("تم نسخ بيانات الشخصيات والمحادثات إلى الحافظة!");
      } catch {
        alert("تعذر النسخ التلقائي.");
      }
    });

    resetAllDataBtn.addEventListener("click", () => {
      if (confirm("هل أنت متأكد من مسح جميع المحادثات والشخصيات المخصصة؟")) {
        localStorage.clear();
        closeDrawer();
        chatView.classList.remove("active");
        homeView.classList.add("active");
        renderBotsGrid();
      }
    });

    // ==================== الشبكة الرئيسية ====================
    function renderBotsGrid() {
      const query = searchInput.value.trim().toLowerCase();
      botsGrid.innerHTML = "";

      const allBots = getAllBots();
      const filteredBots = allBots.filter(bot => {
        const matchesCat =
          activeCategory === "all" ||
          (activeCategory === "custom" && bot.isCustom) ||
          (bot.categories && bot.categories.includes(activeCategory));
        const matchesQuery =
          !query ||
          bot.name.toLowerCase().includes(query) ||
          bot.bio.toLowerCase().includes(query) ||
          (bot.tags && bot.tags.some(t => t.toLowerCase().includes(query)));
        return matchesCat && matchesQuery;
      });

      filteredBots.forEach(bot => {
        const card = document.createElement("div");
        card.className = "bot-card";
        card.innerHTML = `
          ${bot.isCustom ? `<button class="delete-custom-btn" title="حذف الشخصية">✕</button>` : ""}
          <div class="card-media">
            <img src="${bot.avatarUrl}" alt="${escapeHtml(bot.name)}" loading="lazy" />
            <div class="chat-count-badge">💬 ${escapeHtml(bot.chatsCount || "جديد")}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(bot.name)}</div>
            <div class="card-desc">${escapeHtml(bot.bio)}</div>
            <div class="card-tags">
              ${(bot.tags || []).map(tag => `<span class="tag-chip">${escapeHtml(tag)}</span>`).join("")}
            </div>
          </div>
        `;

        if (bot.isCustom) {
          card.querySelector(".delete-custom-btn").onclick = (e) => {
            e.stopPropagation();
            if (confirm(`حذف شخصية "${bot.name}"؟`)) {
              const updated = getAllBots().filter(b => b.isCustom && b.botId !== bot.botId);
              localStorage.setItem(STORAGE_KEY_CUSTOM_BOTS, JSON.stringify(updated));
              localStorage.removeItem(getStorageKey(bot));
              renderBotsGrid();
            }
          };
        }

        card.onclick = () => openBotChat(bot);
        botsGrid.appendChild(card);
      });

      const addCard = document.createElement("div");
      addCard.className = "add-bot-card";
      addCard.innerHTML = `
        <div class="add-icon-circle">+</div>
        <p>إضافة شخصية جديدة</p>
        <small>اربط أي Bot ID و Session ID</small>
      `;
      addCard.onclick = () => {
        addBotModal.classList.add("open");
      };
      botsGrid.appendChild(addCard);
    }

    cancelAddBotBtn.addEventListener("click", () => {
      addBotModal.classList.remove("open");
    });

    saveNewBotBtn.addEventListener("click", () => {
      const name = document.getElementById("newBotName").value.trim();
      const botId = Number(document.getElementById("newBotId").value.trim());
      const sessionId = Number(document.getElementById("newSessionId").value.trim());
      const avatarUrl = document.getElementById("newBotAvatar").value.trim() || "https://d.top4top.io/p_39776f6w21.jpg";
      const bio = document.getElementById("newBotBio").value.trim() || "شخصية مخصصة للمحادثة التفاعلية.";
      const greeting = document.getElementById("newBotGreeting").value.trim() || "*تبتسم وتنظر إليك*\n“أهلاً بك!”";

      if (!name || !botId || !sessionId) {
        alert("يرجى إدخال اسم الشخصية و Bot ID و Session ID.");
        return;
      }

      const customList = getAllBots().filter(b => b.isCustom);
      customList.push({
        botId,
        sessionId,
        name,
        avatarUrl,
        chatsCount: "مخصص",
        isCustom: true,
        categories: ["all", "custom"],
        tags: ["مخصص", "قصة"],
        bio,
        greeting,
        sendWelcomeImage: false,
        initialQuickReplies: [
          { label: "مرحبا", text: "مرحبا" },
          { label: "*ينظر باهتمام*", text: "*ينظر إليها باهتمام* من أنتِ؟" },
          { label: "أخبريني عن نفسك", text: "أخبريني أكثر عن نفسك وعن هذا المكان." }
        ]
      });

      localStorage.setItem(STORAGE_KEY_CUSTOM_BOTS, JSON.stringify(customList));
      addBotModal.classList.remove("open");
      ["newBotName", "newBotId", "newSessionId", "newBotAvatar", "newBotBio", "newBotGreeting"].forEach(id => {
        document.getElementById(id).value = "";
      });
      renderBotsGrid();
    });

    categoryTabs.querySelectorAll(".filter-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        categoryTabs.querySelectorAll(".filter-pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.filter;
        renderBotsGrid();
      });
    });

    searchInput.addEventListener("input", renderBotsGrid);

    // ==================== التنقل وإدارة الجلسة ====================
    function getStorageKey(bot) {
      return `yollo_chat_bot_${bot.botId}_v1`;
    }

    function getDefaultMessages(bot) {
      const list = [
        {
          role: "bot",
          type: "text",
          ltr: /[a-zA-Z]{10,}/.test(bot.greeting) && !/[\u0600-\u06FF]/.test(bot.greeting),
          content: bot.greeting
        }
      ];
      if (bot.sendWelcomeImage && bot.avatarUrl) {
        list.push({
          role: "bot",
          type: "image",
          imageUrl: bot.avatarUrl,
          content: ""
        });
      }
      return list;
    }

    function loadBotMessages(bot) {
      try {
        const raw = localStorage.getItem(getStorageKey(bot));
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch {}
      return getDefaultMessages(bot);
    }

    function saveMessages() {
      if (!currentBot) return;
      localStorage.setItem(getStorageKey(currentBot), JSON.stringify(messages));
    }

    function openBotChat(bot) {
      currentBot = bot;
      chatHeaderAvatar.src = bot.avatarUrl;
      chatHeaderAvatar.alt = bot.name;
      chatHeaderName.textContent = bot.name;
      ambientBg.style.backgroundImage = `url('${bot.avatarUrl}')`;

      messages = loadBotMessages(bot);
      renderAllMessages();

      homeView.classList.remove("active");
      chatView.classList.add("active");
    }

    backBtn.addEventListener("click", () => {
      chatView.classList.remove("active");
      homeView.classList.add("active");
      renderBotsGrid();
    });

    // ==================== تنسيق وعرض الرسائل ====================
    function formatRoleplayText(rawText) {
      const tokenRegex = /(\*[^*]+\*|"[^"]+"|“[^”]+”|«[^»]+»)/g;
      const parts = rawText.split(tokenRegex);

      return parts.map(part => {
        if (!part) return "";
        if (/^\*[^*]+\*$/.test(part)) {
          return `<span class="rp-action">${escapeHtml(part)}</span>`;
        }
        if (/^("[^"]+"|“[^”]+”|«[^»]+»)$/.test(part)) {
          return `<span class="rp-quote">${escapeHtml(part)}</span>`;
        }
        return escapeHtml(part);
      }).join("");
    }

    function generateSmartQuickReplies(lastBotText, allMessages = []) {
      const userCount = allMessages.filter(m => m.role === "user").length;
      if (!lastBotText || userCount === 0) {
        return currentBot ? currentBot.initialQuickReplies : [];
      }

      const sentTexts = new Set(
        allMessages.filter(m => m.role === "user").map(m => m.content.trim())
      );

      const paragraphs = lastBotText.split(/\n+/).map(p => p.trim()).filter(Boolean);
      const recentFocus = paragraphs.slice(-2).join(" ").toLowerCase();
      const fullText = lastBotText.toLowerCase();

      const pickTopic = (txt) => {
        if (/أرض|نزرع|زراع|مزرع|شتا|نتفقد|محصول|حقل|إصلاح/.test(txt)) {
          return [
            { label: "يلا نتفقد الأرض معاً", text: "*يوافق برأسه* يلا نطلع نتفقد الأرض من ورا ونشوف شو نقدر نزرع قبل الشتا." },
            { label: "شو نقدر نزرع هلا؟", text: "شو المحاصيل اللي تتحمل البرد ونقدر نزرعها قبل ما يجي الشتا؟" },
            { label: "في أدوات زراعة هون؟", text: "عندك فكرة إذا في أدوات زراعة أو بذور مخزنة بالمزرعة؟" },
            { label: "*يمشي باتجاه الباب الخلفي*", text: "*يتجه نحو الباب الخلفي للمنزل ليخرج إلى الأرض*" }
          ];
        }

        if (/حليب|بقر|كعك|كيك|خبز|مطبخ|طعام|وصف|مكون|سر/.test(txt)) {
          return [
            { label: "ما رح أخبر حدا، وعد", text: "لا تقلقي، سرك بأمان معي وما رح أخبر حدا." },
            { label: "يلا نروح نتفقد الأرض", text: "تمام، خلينا هلا نطلع نتفقد الأرض قبل ما يجي الشتا." },
            { label: "*يضحك بخفة*", text: "*يضحك بخفة على تلعثمها* المهم إنه طعمه طيب فعلاً." },
            { label: "شو الخطوة الجاية؟", text: "طيب، شو خطتنا الجاية بالمزرعة؟" }
          ];
        }

        if (/\?|؟|إيش رأيك|شو رأيك|هل|ماذا|كيف/.test(txt)) {
          return [
            { label: "فكرة ممتازة، يلا", text: "فكرة ممتازة، يلا نبدأ فوراً." },
            { label: "خلينا نخطط أول", text: "خلينا نخطط بهدوء قبل ما نبدأ." },
            { label: "*ينظر إليها باهتمام*", text: "*ينظر إليها باهتمام* شو برأيك الأهم حالياً؟" },
            { label: "كملي كلامك", text: "كملي، أنا عم بسمعك." }
          ];
        }

        return null;
      };

      let candidates = pickTopic(recentFocus) || pickTopic(fullText) || [
        { label: "استمري", text: "استمري." },
        { label: "*يتفقد المكان حوله*", text: "*يتفقد المكان حوله بفضول*" },
        { label: "شو لازم نعمل هلا؟", text: "شو برأيك لازم نعمل هلا؟" },
        { label: "*يبتسم بهدوء*", text: "*يبتسم بهدوء*" }
      ];

      const filtered = candidates.filter(item => !sentTexts.has(item.text.trim()));
      return filtered.length > 0 ? filtered : [
        { label: "كملي القصة", text: "كملي، شو صار بعدين؟" },
        { label: "*يأخذ نفساً عميقاً*", text: "*يأخذ نفساً عميقاً وينظر للأفق*" },
        { label: "خلينا نتحرك", text: "يلا نتحرك ونشوف الوضع." }
      ];
    }

    function renderQuickBar() {
      const lastBotTextMsg = [...messages]
        .reverse()
        .find(m => m.role === "bot" && m.type !== "image" && m.content);

      const suggestions = generateSmartQuickReplies(
        lastBotTextMsg ? lastBotTextMsg.content : "",
        messages
      );

      quickBar.innerHTML = "";
      suggestions.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "chip";
        btn.textContent = item.label;
        btn.onclick = () => sendMessage(item.text);
        quickBar.appendChild(btn);
      });
    }

    function setTypingState(active) {
      isSending = active;
      sendBtn.disabled = active;
      if (active) {
        statusDot.classList.add("typing");
        statusText.textContent = "يكتب الآن...";
      } else {
        statusDot.classList.remove("typing");
        statusText.textContent = "متصل • جاهز";
      }
    }

    function renderCharacterIntro() {
      if (!currentBot) return;
      const intro = document.createElement("div");
      intro.className = "character-intro";
      intro.innerHTML = `
        <img class="intro-avatar" src="${currentBot.avatarUrl}" alt="${escapeHtml(currentBot.name)}" />
        <div class="intro-name">${escapeHtml(currentBot.name)}</div>
        <div class="intro-bio">${escapeHtml(currentBot.bio)}</div>
      `;
      chatContainer.appendChild(intro);
    }

    function renderMessage(msg, index, shouldScroll = true) {
      const row = document.createElement("div");
      row.className = `msg-row ${msg.role}`;

      if ((msg.role === "bot" || msg.role === "error") && currentBot) {
        const avatar = document.createElement("img");
        avatar.className = "msg-avatar";
        avatar.src = currentBot.avatarUrl;
        avatar.alt = currentBot.name;
        row.appendChild(avatar);
      }

      const contentWrap = document.createElement("div");
      contentWrap.className = "msg-content-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (msg.type === "image" && msg.imageUrl) {
        bubble.classList.add("image-bubble");
        const img = document.createElement("img");
        img.className = "chat-sent-img";
        img.src = msg.imageUrl;
        img.alt = currentBot ? currentBot.name : "";
        bubble.appendChild(img);
      } else if (msg.role === "bot") {
        if (msg.ltr) bubble.classList.add("ltr-msg");
        bubble.innerHTML = formatRoleplayText(msg.content);
      } else {
        bubble.textContent = msg.content;
      }

      contentWrap.appendChild(bubble);

      if (msg.type !== "image" && msg.content && index >= 1 && msg.role !== "error") {
        const tools = document.createElement("div");
        tools.className = "msg-tools";

        const copyBtn = document.createElement("button");
        copyBtn.className = "mini-tool-btn";
        copyBtn.textContent = "نسخ";
        copyBtn.onclick = async () => {
          try {
            await navigator.clipboard.writeText(msg.content);
            copyBtn.textContent = "تم ✓";
            setTimeout(() => { copyBtn.textContent = "نسخ"; }, 1200);
          } catch {}
        };

        const delBtn = document.createElement("button");
        delBtn.className = "mini-tool-btn";
        delBtn.textContent = "حذف";
        delBtn.onclick = () => {
          messages.splice(index, 1);
          saveMessages();
          renderAllMessages();
        };

        tools.appendChild(copyBtn);
        tools.appendChild(delBtn);
        contentWrap.appendChild(tools);
      }

      row.appendChild(contentWrap);
      chatContainer.appendChild(row);

      if (shouldScroll) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    function renderAllMessages() {
      chatContainer.innerHTML = "";
      renderCharacterIntro();
      messages.forEach((m, idx) => renderMessage(m, idx, false));
      chatContainer.scrollTop = chatContainer.scrollHeight;
      renderQuickBar();
    }

    function showTypingBubble() {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.id = "typingIndicator";
      row.innerHTML = `
        <img class="msg-avatar" src="${currentBot ? currentBot.avatarUrl : ""}" alt="" />
        <div class="msg-content-wrap">
          <div class="bubble">
            <div class="typing-dots"><span></span><span></span><span></span></div>
          </div>
        </div>
      `;
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingBubble() {
      const el = document.getElementById("typingIndicator");
      if (el) el.remove();
    }

    async function sendMessage(customText) {
      const text = (customText ?? msgInput.value).trim();
      if (!text || isSending || !currentBot) return;

      playUiPop(580);
      const userMsg = { role: "user", type: "text", content: text };
      messages.push(userMsg);
      saveMessages();
      renderMessage(userMsg, messages.length - 1);

      msgInput.value = "";
      msgInput.style.height = "44px";
      setTypingState(true);
      showTypingBubble();

      try {
        const endpoint = `${API_BASE_URL.replace(/\/+$/, "")}/api/chat`;
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            botId: currentBot.botId,
            sessionId: currentBot.sessionId
          })
        });

        const data = await response.json();
        removeTypingBubble();

        if (!response.ok || !data.ok) {
          const errText = data.reply || data.error || "حدث خطأ أثناء الاتصال بالنموذج";
          renderMessage({ role: "error", type: "text", content: errText }, -1);
        } else {
          playUiPop(440);
          const botMsg = { role: "bot", type: "text", content: data.reply };
          messages.push(botMsg);
          saveMessages();
          renderMessage(botMsg, messages.length - 1);
          renderQuickBar();
        }
      } catch (err) {
        removeTypingBubble();
        renderMessage({
          role: "error",
          type: "text",
          content: "تعذر الوصول إلى السيرفر. تأكد من أن خادم Render نشط."
        }, -1);
      } finally {
        setTypingState(false);
      }
    }

    msgInput.addEventListener("input", () => {
      msgInput.style.height = "44px";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 110) + "px";
    });

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", () => sendMessage());

    clearBtn.addEventListener("click", () => {
      if (!currentBot) return;
      if (confirm("هل تريد إعادة المحادثة إلى البداية؟")) {
        messages = getDefaultMessages(currentBot);
        saveMessages();
        renderAllMessages();
      }
    });

    applyPreferences();
    renderBotsGrid();
  </script>
</body>
</html>
