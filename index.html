<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cow Girl Emma — محادثة تفاعلية</title>
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-header: #111827;
      --bg-bot: #1a2234;
      --bg-user: #2563eb;
      --bg-input: #161e2e;
      --border-color: #273248;
      --text-primary: #f3f4f6;
      --text-action: #9ca3af;
      --text-quote: #ffffff;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* الشريط العلوي */
    header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }

    .bot-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .bot-info h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-action);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
    }

    .status-dot.typing {
      background-color: #f59e0b;
      animation: pulse 1s infinite;
    }

    .icon-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .icon-btn.danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    /* منطقة الرسائل */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeIn 0.2s ease-out;
    }

    .msg-row.user {
      align-self: flex-start;
    }

    .msg-row.bot {
      align-self: flex-end;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.72;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg-row.user .bubble {
      background-color: var(--bg-user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.bot .bubble {
      background-color: var(--bg-bot);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .msg-row.error .bubble {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* تنسيق تقمص الأدوار النظيف */
    .rp-action {
      color: var(--text-action);
      font-style: italic;
    }

    .rp-quote {
      color: var(--text-quote);
      font-weight: 600;
    }

    /* مؤشر جاري الكتابة */
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background-color: var(--text-action);
      border-radius: 50%;
      animation: bounce 1.3s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    /* شريط الأزرار السريعة الذكي */
    .quick-bar {
      display: flex;
      gap: 8px;
      padding: 8px 14px;
      overflow-x: auto;
      background-color: var(--bg-main);
      border-top: 1px solid rgba(39, 50, 72, 0.5);
      scrollbar-width: none;
    }

    .quick-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.15s;
    }

    .chip:active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* منطقة الإدخال */
    .input-area {
      background-color: var(--bg-header);
      border-top: 1px solid var(--border-color);
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      padding: 11px 14px;
      font-size: 14.5px;
      resize: none;
      max-height: 110px;
      min-height: 44px;
      outline: none;
      line-height: 1.4;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    #sendBtn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      height: 44px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="bot-profile">
      <div class="avatar">E</div>
      <div class="bot-info">
        <h1>Cow Girl Emma</h1>
        <div class="status-line">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">متصل • جاهز</span>
        </div>
      </div>
    </div>
    <div>
      <button class="icon-btn danger" id="clearBtn">مسح</button>
    </div>
  </header>

  <main id="chatContainer"></main>

  <div class="quick-bar" id="quickBar"></div>

  <div class="input-area">
    <textarea id="msgInput" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
    <button id="sendBtn">إرسال</button>
  </div>

  <script>
    const API_BASE_URL = "https://hin-18-1.onrender.com";
    const STORAGE_KEY_CHAT = "yollo_custom_chat_v2";

    const INITIAL_QUICK_REPLIES = [
      { label: "مرحبا", text: "مرحبا" },
      { label: "*ينظر حوله في المزرعة*", text: "*ينظر حوله في المزرعة*" },
      { label: "أخبريني عن المزرعة", text: "أخبريني عن المزرعة" },
      { label: "ما سر الكعك؟", text: "ما سر الكعك الذي تخبزينه؟" }
    ];

    const chatContainer = document.getElementById("chatContainer");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const quickBar = document.getElementById("quickBar");
    const clearBtn = document.getElementById("clearBtn");

    let messages = JSON.parse(localStorage.getItem(STORAGE_KEY_CHAT) || "[]");
    let isSending = false;

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // تنسيق آمن بدون أي تداخل مع علامات HTML
    function formatRoleplayText(rawText) {
      const tokenRegex = /(\*[^*]+\*|"[^"]+"|“[^”]+”|«[^»]+»)/g;
      const parts = rawText.split(tokenRegex);

      return parts.map(part => {
        if (!part) return "";
        if (/^\*[^*]+\*$/.test(part)) {
          return `<span class="rp-action">${escapeHtml(part)}</span>`;
        }
        if (/^("[^"]+"|“[^”]+”|«[^»]+»)$/.test(part)) {
          return `<span class="rp-quote">${escapeHtml(part)}</span>`;
        }
        return escapeHtml(part);
      }).join("");
    }

    // توليد ردود سريعة ذكية بناءً على آخر رد للشخصية
    function generateSmartQuickReplies(lastBotText) {
      if (!lastBotText) return INITIAL_QUICK_REPLIES;

      const t = lastBotText.toLowerCase();

      if (/كعك|خبز|مطبخ|طعام|أكل|مكون|سر|تذوق|جرب/.test(t)) {
        return [
          { label: "*يتذوق قطعة بحذر*", text: "*يتذوق قطعة صغيرة بحذر ويراقب رد فعلها*" },
          { label: "ما المكون السري؟", text: "أخبريني، ما هو المكون السري في هذا الكعك؟" },
          { label: "طعمه لذيذ فعلاً!", text: "طعمه لذيذ فعلاً! من أين تعلمتِ الخبز؟" },
          { label: "*يبتسم*", text: "*يبتسم بهدوء ويجلس قريباً*" }
        ];
      }

      if (/مزرع|أرض|حيوان|محصول|عمل|إصلاح|خراب|بيت/.test(t)) {
        return [
          { label: "كيف نصلح المزرعة؟", text: "برأيك من أين نبدأ لإصلاح هذه المزرعة؟" },
          { label: "هل يوجد حيوانات هنا؟", text: "هل كان هناك أي حيوانات أو محاصيل قبل وصولي؟" },
          { label: "*يتفقد المكان*", text: "*يتفقد أرجاء المنزل والمزرعة بتأنٍ*" },
          { label: "سأساعدك", text: "لا تقلقي، سنعيد بناء هذا المكان معاً." }
        ];
      }

      if (/\?|؟|هل|ماذا|كيف|لماذا|أين/.test(t)) {
        return [
          { label: "نعم، بالتأكيد", text: "نعم، بالتأكيد." },
          { label: "لا، ليس بعد", text: "لا، ليس بعد، لكنني مستعد." },
          { label: "أخبريني أكثر", text: "أخبريني أكثر عن ذلك." },
          { label: "*يفكر قليلاً*", text: "*يفكر للحظة ثم يرد عليها*" }
        ];
      }

      return [
        { label: "استمري", text: "استمري." },
        { label: "*يقترب منها*", text: "*يقترب منها بهدوء*" },
        { label: "وماذا بعد؟", text: "وماذا بعد ذلك؟" },
        { label: "*يستمع بانتباه*", text: "*يستمع إليها بانتباه*" }
      ];
    }

    function renderQuickBar() {
      const lastBotMsg = [...messages].reverse().find(m => m.role === "bot");
      const suggestions = generateSmartQuickReplies(lastBotMsg ? lastBotMsg.content : "");

      quickBar.innerHTML = "";
      suggestions.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "chip";
        btn.textContent = item.label;
        btn.onclick = () => sendMessage(item.text);
        quickBar.appendChild(btn);
      });
    }

    function setTypingState(active) {
      isSending = active;
      sendBtn.disabled = active;
      if (active) {
        statusDot.classList.add("typing");
        statusText.textContent = "يكتب الآن...";
      } else {
        statusDot.classList.remove("typing");
        statusText.textContent = "متصل • جاهز";
      }
    }

    function saveMessages() {
      localStorage.setItem(STORAGE_KEY_CHAT, JSON.stringify(messages));
    }

    function renderMessage(msg, shouldScroll = true) {
      const row = document.createElement("div");
      row.className = `msg-row ${msg.role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (msg.role === "bot") {
        bubble.innerHTML = formatRoleplayText(msg.content);
      } else {
        bubble.textContent = msg.content;
      }

      row.appendChild(bubble);
      chatContainer.appendChild(row);

      if (shouldScroll) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    function renderAllMessages() {
      chatContainer.innerHTML = "";
      messages.forEach(m => renderMessage(m, false));
      chatContainer.scrollTop = chatContainer.scrollHeight;
      renderQuickBar();
    }

    function showTypingBubble() {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.id = "typingIndicator";
      row.innerHTML = `
        <div class="bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingBubble() {
      const el = document.getElementById("typingIndicator");
      if (el) el.remove();
    }

    async function sendMessage(customText) {
      const text = (customText ?? msgInput.value).trim();
      if (!text || isSending) return;

      const userMsg = { role: "user", content: text };
      messages.push(userMsg);
      saveMessages();
      renderMessage(userMsg);

      msgInput.value = "";
      msgInput.style.height = "44px";
      setTypingState(true);
      showTypingBubble();

      try {
        const endpoint = `${API_BASE_URL.replace(/\/+$/, "")}/api/chat`;
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        removeTypingBubble();

        if (!response.ok || !data.ok) {
          const errText = data.reply || data.error || "حدث خطأ أثناء الاتصال بالنموذج";
          renderMessage({ role: "error", content: errText });
        } else {
          const botMsg = { role: "bot", content: data.reply };
          messages.push(botMsg);
          saveMessages();
          renderMessage(botMsg);
          renderQuickBar();
        }
      } catch (err) {
        removeTypingBubble();
        renderMessage({
          role: "error",
          content: "تعذر الوصول إلى السيرفر. تأكد من أن خادم Render نشط."
        });
      } finally {
        setTypingState(false);
      }
    }

    msgInput.addEventListener("input", () => {
      msgInput.style.height = "44px";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 110) + "px";
    });

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", () => sendMessage());

    clearBtn.addEventListener("click", () => {
      if (confirm("هل تريد مسح سجل المحادثة من الشاشة؟")) {
        messages = [];
        saveMessages();
        renderAllMessages();
      }
    });

    renderAllMessages();
  </script>
</body>
</html>
