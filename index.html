<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cow Girl Emma — محادثة تفاعلية</title>
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-header: #111827;
      --bg-bot: #1a2234;
      --bg-user: #2563eb;
      --bg-input: #161e2e;
      --border-color: #273248;
      --text-primary: #f3f4f6;
      --text-action: #9ca3af;
      --text-quote: #ffffff;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* الشريط العلوي */
    header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }

    .bot-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.18);
      background-color: #1f2937;
    }

    .bot-info h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-action);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
    }

    .status-dot.typing {
      background-color: #f59e0b;
      animation: pulse 1s infinite;
    }

    .icon-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .icon-btn.danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    /* منطقة الرسائل */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* بطاقة تعريف الشخصية في أعلى المحادثة */
    .character-intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 14px 12px 18px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(39, 50, 72, 0.5);
    }

    .intro-avatar {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      margin-bottom: 10px;
      background-color: #1f2937;
    }

    .intro-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .intro-bio {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-action);
      max-width: 92%;
      direction: ltr;
    }

    /* صفوف الرسائل */
    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      max-width: 92%;
      animation: fadeIn 0.2s ease-out;
    }

    .msg-row.user {
      align-self: flex-start;
      flex-direction: row;
    }

    .msg-row.bot,
    .msg-row.error {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      flex-shrink: 0;
      margin-top: 2px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: #1f2937;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg-row.user .bubble {
      background-color: var(--bg-user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.bot .bubble {
      background-color: var(--bg-bot);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .msg-row.bot .bubble.ltr-msg {
      direction: ltr;
      text-align: left;
    }

    .msg-row.bot .bubble.image-bubble {
      padding: 6px;
      background-color: var(--bg-bot);
      border: 1px solid var(--border-color);
    }

    .chat-sent-img {
      display: block;
      width: 210px;
      max-width: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    .msg-row.error .bubble {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* تنسيق تقمص الأدوار */
    .rp-action {
      color: var(--text-action);
      font-style: italic;
    }

    .rp-quote {
      color: var(--text-quote);
      font-weight: 600;
    }

    /* مؤشر جاري الكتابة */
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background-color: var(--text-action);
      border-radius: 50%;
      animation: bounce 1.3s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    /* شريط الأزرار السريعة الذكي */
    .quick-bar {
      display: flex;
      gap: 8px;
      padding: 8px 14px;
      overflow-x: auto;
      background-color: var(--bg-main);
      border-top: 1px solid rgba(39, 50, 72, 0.5);
      scrollbar-width: none;
    }

    .quick-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.15s;
    }

    .chip:active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* منطقة الإدخال */
    .input-area {
      background-color: var(--bg-header);
      border-top: 1px solid var(--border-color);
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      padding: 11px 14px;
      font-size: 14.5px;
      resize: none;
      max-height: 110px;
      min-height: 44px;
      outline: none;
      line-height: 1.4;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    #sendBtn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      height: 44px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="bot-profile">
      <img class="header-avatar" src="https://d.top4top.io/p_39776f6w21.jpg" alt="Cow Girl Emma" />
      <div class="bot-info">
        <h1>Cow Girl Emma</h1>
        <div class="status-line">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">متصل • جاهز</span>
        </div>
      </div>
    </div>
    <div>
      <button class="icon-btn danger" id="clearBtn">مسح</button>
    </div>
  </header>

  <main id="chatContainer"></main>

  <div class="quick-bar" id="quickBar"></div>

  <div class="input-area">
    <textarea id="msgInput" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
    <button id="sendBtn">إرسال</button>
  </div>

  <script>
    const API_BASE_URL = "https://hin-18-1.onrender.com";
    const BOT_AVATAR_URL = "https://d.top4top.io/p_39776f6w21.jpg";
    const BOT_NAME = "Cow Girl Emma";
    const BOT_BIO = 'Emma is a little dense cow girl. She does have a very positive energy. Emma loves to bake, insisting on you trying her food. Food she baked with her “secret ingredient”.';

    const STORAGE_KEY_CHAT = "yollo_emma_chat_v3";

    const DEFAULT_MESSAGES = [
      {
        role: "bot",
        type: "text",
        ltr: true,
        content: "*You recently inherited a farm from your grandparents. You have always struggled with money so you think life on a farm could work to make an extra buck. When you make it to the farm for the first time. It’s completely dilapidated with no crops or livestock to be seen. When you enter the house off to the side, you find a woman with cow horns and a tail, wearing a cow print bikini and a bell collar sleeping on the floor. She wakes up when you enter.*\n“Hello, master.”"
      },
      {
        role: "bot",
        type: "image",
        imageUrl: BOT_AVATAR_URL,
        content: ""
      }
    ];

    const INITIAL_QUICK_REPLIES = [
      { label: "مرحبا", text: "مرحبا" },
      { label: "*ينظر حوله بدهشة*", text: "*ينظر حوله في المنزل المتهالك بدهشة* من أنتِ؟ وكيف دخلتِ إلى هنا؟" },
      { label: "أخبريني عن المزرعة", text: "مرحباً إيما، أنا صاحب المزرعة الجديد. أخبريني ما الذي حدث لهذا المكان؟" },
      { label: "ما سر الكعك؟", text: "سمعت أنكِ تحبين الخبز، ما الذي تطبخينه هنا؟" }
    ];

    const chatContainer = document.getElementById("chatContainer");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const quickBar = document.getElementById("quickBar");
    const clearBtn = document.getElementById("clearBtn");

    function loadSavedMessages() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CHAT);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch {}
      return JSON.parse(JSON.stringify(DEFAULT_MESSAGES));
    }

    let messages = loadSavedMessages();
    let isSending = false;

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatRoleplayText(rawText) {
      const tokenRegex = /(\*[^*]+\*|"[^"]+"|“[^”]+”|«[^»]+»)/g;
      const parts = rawText.split(tokenRegex);

      return parts.map(part => {
        if (!part) return "";
        if (/^\*[^*]+\*$/.test(part)) {
          return `<span class="rp-action">${escapeHtml(part)}</span>`;
        }
        if (/^("[^"]+"|“[^”]+”|«[^»]+»)$/.test(part)) {
          return `<span class="rp-quote">${escapeHtml(part)}</span>`;
        }
        return escapeHtml(part);
      }).join("");
    }

    function generateSmartQuickReplies(lastBotText, allMessages = []) {
      const userCount = allMessages.filter(m => m.role === "user").length;
      if (!lastBotText || userCount === 0) return INITIAL_QUICK_REPLIES;

      const sentTexts = new Set(
        allMessages.filter(m => m.role === "user").map(m => m.content.trim())
      );

      const paragraphs = lastBotText.split(/\n+/).map(p => p.trim()).filter(Boolean);
      const recentFocus = paragraphs.slice(-2).join(" ").toLowerCase();
      const fullText = lastBotText.toLowerCase();

      const pickTopic = (txt) => {
        if (/أرض|نزرع|زراع|مزرع|شتا|نتفقد|محصول|حقل|إصلاح/.test(txt)) {
          return [
            { label: "يلا نتفقد الأرض معاً", text: "*يوافق برأسه* يلا نطلع نتفقد الأرض من ورا ونشوف شو نقدر نزرع قبل الشتا." },
            { label: "شو نقدر نزرع هلا؟", text: "شو المحاصيل اللي تتحمل البرد ونقدر نزرعها قبل ما يجي الشتا؟" },
            { label: "في أدوات زراعة هون؟", text: "عندك فكرة إذا في أدوات زراعة أو بذور مخزنة بالمزرعة؟" },
            { label: "*يمشي باتجاه الباب الخلفي*", text: "*يتجه نحو الباب الخلفي للمنزل ليخرج إلى الأرض*" }
          ];
        }

        if (/حليب|بقر|كعك|كيك|خبز|مطبخ|طعام|وصف|مكون|سر/.test(txt)) {
          return [
            { label: "ما رح أخبر حدا، وعد", text: "لا تقلقي، سرك بأمان معي وما رح أخبر حدا." },
            { label: "يلا نروح نتفقد الأرض", text: "تمام، خلينا هلا نطلع نتفقد الأرض قبل ما يجي الشتا." },
            { label: "*يضحك بخفة*", text: "*يضحك بخفة على تلعثمها* المهم إنه طعمه طيب فعلاً." },
            { label: "شو الخطوة الجاية؟", text: "طيب، شو خطتنا الجاية بالمزرعة؟" }
          ];
        }

        if (/\?|؟|إيش رأيك|شو رأيك|هل|ماذا|كيف/.test(txt)) {
          return [
            { label: "فكرة ممتازة، يلا", text: "فكرة ممتازة، يلا نبدأ فوراً." },
            { label: "خلينا نخطط أول", text: "خلينا نخطط بهدوء قبل ما نبدأ." },
            { label: "*ينظر إليها باهتمام*", text: "*ينظر إليها باهتمام* شو برأيك الأهم حالياً؟" },
            { label: "كملي كلامك", text: "كملي، أنا عم بسمعك." }
          ];
        }

        return null;
      };

      let candidates = pickTopic(recentFocus) || pickTopic(fullText) || [
        { label: "استمري", text: "استمري." },
        { label: "*يتفقد المكان حوله*", text: "*يتفقد المكان حوله بفضول*" },
        { label: "شو لازم نعمل هلا؟", text: "شو برأيك لازم نعمل هلا؟" },
        { label: "*يبتسم بهدوء*", text: "*يبتسم بهدوء*" }
      ];

      const filtered = candidates.filter(item => !sentTexts.has(item.text.trim()));
      return filtered.length > 0 ? filtered : [
        { label: "كملي القصة", text: "كملي، شو صار بعدين؟" },
        { label: "*يأخذ نفساً عميقاً*", text: "*يأخذ نفساً عميقاً وينظر للأفق*" },
        { label: "خلينا نتحرك", text: "يلا نتحرك ونشوف الوضع." }
      ];
    }

    function renderQuickBar() {
      const lastBotTextMsg = [...messages]
        .reverse()
        .find(m => m.role === "bot" && m.type !== "image" && m.content);

      const suggestions = generateSmartQuickReplies(
        lastBotTextMsg ? lastBotTextMsg.content : "",
        messages
      );

      quickBar.innerHTML = "";
      suggestions.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "chip";
        btn.textContent = item.label;
        btn.onclick = () => sendMessage(item.text);
        quickBar.appendChild(btn);
      });
    }

    function setTypingState(active) {
      isSending = active;
      sendBtn.disabled = active;
      if (active) {
        statusDot.classList.add("typing");
        statusText.textContent = "يكتب الآن...";
      } else {
        statusDot.classList.remove("typing");
        statusText.textContent = "متصل • جاهز";
      }
    }

    function saveMessages() {
      localStorage.setItem(STORAGE_KEY_CHAT, JSON.stringify(messages));
    }

    function renderCharacterIntro() {
      const intro = document.createElement("div");
      intro.className = "character-intro";
      intro.innerHTML = `
        <img class="intro-avatar" src="${BOT_AVATAR_URL}" alt="${BOT_NAME}" />
        <div class="intro-name">${BOT_NAME}</div>
        <div class="intro-bio">${escapeHtml(BOT_BIO)}</div>
      `;
      chatContainer.appendChild(intro);
    }

    function renderMessage(msg, shouldScroll = true) {
      const row = document.createElement("div");
      row.className = `msg-row ${msg.role}`;

      if (msg.role === "bot" || msg.role === "error") {
        const avatar = document.createElement("img");
        avatar.className = "msg-avatar";
        avatar.src = BOT_AVATAR_URL;
        avatar.alt = BOT_NAME;
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (msg.type === "image" && msg.imageUrl) {
        bubble.classList.add("image-bubble");
        const img = document.createElement("img");
        img.className = "chat-sent-img";
        img.src = msg.imageUrl;
        img.alt = BOT_NAME;
        bubble.appendChild(img);
      } else if (msg.role === "bot") {
        if (msg.ltr) bubble.classList.add("ltr-msg");
        bubble.innerHTML = formatRoleplayText(msg.content);
      } else {
        bubble.textContent = msg.content;
      }

      row.appendChild(bubble);
      chatContainer.appendChild(row);

      if (shouldScroll) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    function renderAllMessages() {
      chatContainer.innerHTML = "";
      renderCharacterIntro();
      messages.forEach(m => renderMessage(m, false));
      chatContainer.scrollTop = chatContainer.scrollHeight;
      renderQuickBar();
    }

    function showTypingBubble() {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.id = "typingIndicator";
      row.innerHTML = `
        <img class="msg-avatar" src="${BOT_AVATAR_URL}" alt="${BOT_NAME}" />
        <div class="bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingBubble() {
      const el = document.getElementById("typingIndicator");
      if (el) el.remove();
    }

    async function sendMessage(customText) {
      const text = (customText ?? msgInput.value).trim();
      if (!text || isSending) return;

      const userMsg = { role: "user", type: "text", content: text };
      messages.push(userMsg);
      saveMessages();
      renderMessage(userMsg);

      msgInput.value = "";
      msgInput.style.height = "44px";
      setTypingState(true);
      showTypingBubble();

      try {
        const endpoint = `${API_BASE_URL.replace(/\/+$/, "")}/api/chat`;
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        removeTypingBubble();

        if (!response.ok || !data.ok) {
          const errText = data.reply || data.error || "حدث خطأ أثناء الاتصال بالنموذج";
          renderMessage({ role: "error", type: "text", content: errText });
        } else {
          const botMsg = { role: "bot", type: "text", content: data.reply };
          messages.push(botMsg);
          saveMessages();
          renderMessage(botMsg);
          renderQuickBar();
        }
      } catch (err) {
        removeTypingBubble();
        renderMessage({
          role: "error",
          type: "text",
          content: "تعذر الوصول إلى السيرفر. تأكد من أن خادم Render نشط."
        });
      } finally {
        setTypingState(false);
      }
    }

    msgInput.addEventListener("input", () => {
      msgInput.style.height = "44px";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 110) + "px";
    });

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", () => sendMessage());

    clearBtn.addEventListener("click", () => {
      if (confirm("هل تريد إعادة المحادثة إلى البداية؟")) {
        messages = JSON.parse(JSON.stringify(DEFAULT_MESSAGES));
        saveMessages();
        renderAllMessages();
      }
    });

    renderAllMessages();
  </script>
</body>
</html>
